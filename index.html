<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amity Qiu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fff;--ink:#24201c;--ink-2:#6f655d;--ink-3:#a39a91;--rule:#e6ded4;--mat:#f7f2ec;
  --red:#c33a24;--cam:#3b3531;--note:#5f7469;
  --serif:Georgia,"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","Noto Serif CJK SC",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  --grain:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22120%22%20height%3D%22120%22%3E%3Cfilter%20id%3D%22n%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%22.9%22%20numOctaves%3D%222%22%20seed%3D%223%22/%3E%3CfeColorMatrix%20values%3D%220%200%200%200%20.5%200%200%200%200%20.5%200%200%200%200%20.5%200%200%200%20.22%200%22/%3E%3C/filter%3E%3Crect%20width%3D%22120%22%20height%3D%22120%22%20filter%3D%22url%28%23n%29%22/%3E%3C/svg%3E");
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.75;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,64px)}

.top{display:flex;justify-content:space-between;align-items:baseline;padding:26px 0 0}
.top .name{font-family:var(--serif);font-size:20px}
.top .name span{font-family:var(--sans);font-size:13px;color:var(--ink-3);margin-left:10px}
.top a{font-size:13px;color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--rule)}
.top a:hover{color:var(--red);border-color:var(--red)}

/* stage: motto left, shelf right */
.stage{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:40px;align-items:end;min-height:calc(100vh - 80px);padding:40px 0 0}
.motto{align-self:center;padding-bottom:5vh}
.motto h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3.4vw,42px);line-height:1.4;margin:0 0 22px;letter-spacing:.01em}
.motto p{margin:0 0 14px;color:var(--ink-2);font-size:15px;max-width:34em;line-height:1.85}
.hint{margin-top:18px;font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:10px;min-height:22px}
.hint::before{content:"";width:24px;height:1px;background:var(--ink-3);flex:none}
@media (max-width:900px){.stage{grid-template-columns:1fr;min-height:0;align-items:start}.motto{padding-bottom:10px}}

/* ---- shelf ---- */
.shelf{position:relative;display:flex;align-items:flex-end;gap:5px;padding:0 70px 0 10px;border-bottom:1px solid var(--ink);perspective:1400px;perspective-origin:50% 60%}
.shelf::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:1px;background:var(--rule)}
@media (max-width:900px){.shelf{overflow-x:auto;overflow-y:visible;padding-top:30px;scrollbar-width:none}.shelf::-webkit-scrollbar{display:none}}

.book{position:relative;border:0;background:none;padding:0;cursor:pointer;
  width:var(--sw);height:var(--h);flex:none;
  transition:width .7s cubic-bezier(.2,.7,.2,1),transform .35s cubic-bezier(.2,.7,.2,1)}
.book:hover:not(.open){transform:translateY(-10px)}
.b3d{position:absolute;left:0;bottom:0;width:var(--sw);height:var(--h);transform-style:preserve-3d;
  transform-origin:var(--sw) 50%;transform:rotateY(0deg);transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.book.open .b3d{transform:rotateY(-64deg)}
.book.open{width:calc(var(--sw) * .44 + var(--cw) * .9)}
.spine,.cover{position:absolute;bottom:0;left:0;height:var(--h);backface-visibility:hidden}
.spine{width:var(--sw);background:var(--c);
  background-image:linear-gradient(90deg,rgba(0,0,0,.14),rgba(255,255,255,.08) 18%,rgba(255,255,255,0) 40%,rgba(0,0,0,.08) 88%,rgba(0,0,0,.22)),var(--grain);
  font-family:var(--serif);font-size:15px;letter-spacing:.14em;color:var(--t)}
.spine span{position:absolute;top:22px;left:50%;transform:translateX(-50%);writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap}
.spine small{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:var(--sans);font-size:10px;letter-spacing:.04em;opacity:.75;line-height:1.2}
.cover{width:var(--cw);left:var(--sw);transform-origin:0 50%;transform:rotateY(90deg);background:var(--c);
  box-shadow:inset 6px 0 10px -8px rgba(0,0,0,.35)}
.cover svg{width:100%;height:100%;display:block}
.cover::after{content:"";position:absolute;inset:0;background:var(--grain);mix-blend-mode:multiply;opacity:.6;pointer-events:none}
.book.open .spine{filter:brightness(.8)}
.book .shadow{position:absolute;left:4px;right:-6px;bottom:-2px;height:10px;background:radial-gradient(ellipse at center,rgba(36,32,28,.35),transparent 70%);opacity:0;transition:opacity .5s}
.book.open .shadow{opacity:1}

/* rise-in */
.book{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
.book:nth-child(1){animation-delay:.05s}.book:nth-child(2){animation-delay:.12s}.book:nth-child(3){animation-delay:.19s}.book:nth-child(4){animation-delay:.26s}.book:nth-child(5){animation-delay:.33s}.book:nth-child(6){animation-delay:.5s}.book:nth-child(7){animation-delay:.58s}.book:nth-child(8){animation-delay:.66s}
@keyframes rise{from{opacity:0;translate:0 22px}to{opacity:1;translate:0 0}}
@media (prefers-reduced-motion:reduce){.book{animation:none;opacity:1}.b3d,.book{transition:none}}

/* objects: a stack at the end of the row */
.stack{position:relative;flex:none;margin-left:30px;width:136px;height:112px;opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) .5s forwards}
.stack small{position:absolute;left:0;right:0;bottom:-26px;text-align:center;font-size:11px;color:var(--ink-3);letter-spacing:.06em}
.obj{position:absolute;border:0;background:none;padding:0;cursor:pointer;width:auto;height:auto;opacity:1;animation:none;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
/* notebook lying flat, seen from the fore-edge */
.notebook{left:0;bottom:0;width:136px;height:30px;perspective:600px}
.notebook .body{position:absolute;inset:0;background:#e9e1d2;background-image:repeating-linear-gradient(180deg,rgba(0,0,0,.08) 0 1px,transparent 1px 3px),var(--grain);border-radius:1px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.15)}
.notebook .lid{position:absolute;left:-2px;right:-2px;top:0;height:7px;background:var(--note);background-image:var(--grain);border-radius:2px 2px 0 0;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.notebook .base{position:absolute;left:-2px;right:-2px;bottom:0;height:7px;background:var(--note);background-image:var(--grain);border-radius:0 0 2px 2px}
.notebook .band{position:absolute;right:22px;top:-1px;bottom:-1px;width:4px;background:var(--red);opacity:.9}
.notebook .tag{position:absolute;left:14px;top:9px;height:12px;width:38px;background:#fbf7ef;font-size:8px;line-height:12px;text-align:center;color:var(--ink-2);letter-spacing:.1em;font-family:var(--serif)}
.notebook:hover,.notebook.open{transform:translateX(14px)}
.notebook.open .body{box-shadow:inset 0 -1px 0 rgba(0,0,0,.15),0 10px 18px -12px rgba(36,32,28,.5)}
/* camera resting on the notebook */
.camera{left:22px;bottom:30px;width:92px;height:62px}
.camera:hover{transform:translateY(-6px)}
.camera .body{position:absolute;left:0;right:0;bottom:0;height:50px;background:var(--cam);background-image:var(--grain);border-radius:4px}
.camera .leather{position:absolute;left:6px;right:6px;bottom:6px;height:30px;background:#4a423c;background-image:var(--grain);border-radius:2px}
.camera .plate{position:absolute;left:0;right:0;bottom:44px;height:8px;background:#8d857c;border-radius:2px 2px 0 0}
.camera .hump{position:absolute;left:32px;width:28px;bottom:50px;height:12px;background:#8d857c;border-radius:3px 3px 0 0}
.camera .shutterbtn{position:absolute;right:12px;bottom:53px;width:8px;height:5px;background:#c9c2b6;border-radius:1px}
.camera .dial{position:absolute;left:8px;bottom:51px;width:14px;height:6px;background:#3b3531;border-radius:2px 2px 0 0}
.camera .lens{position:absolute;left:31px;bottom:8px;width:30px;height:30px;border-radius:50%;background:#1a1614;box-shadow:0 0 0 3px #8d857c,0 0 0 4px #2a2522,inset 0 0 0 6px #2a2522,inset 0 0 0 8px #0d0b0a;transition:transform .4s}
.camera .lens::after{content:"";position:absolute;left:9px;top:8px;width:6px;height:4px;border-radius:50%;background:rgba(255,255,255,.35)}
.camera.open .lens{transform:scale(1.06)}
.camera .vf{position:absolute;right:14px;bottom:36px;width:12px;height:8px;background:#1a1614;border:1px solid #8d857c}
.camera .dot{position:absolute;left:12px;bottom:38px;width:4px;height:4px;border-radius:50%;background:var(--red);opacity:.5}
.camera.open .dot{opacity:1;box-shadow:0 0 0 3px rgba(195,58,36,.25)}
.stack.open-cam small,.stack.open-note small{color:var(--ink)}


/* ---- project cards under the shelf ---- */
.cards{grid-column:1 / -1;display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:52px}
@media (max-width:860px){.cards{grid-template-columns:1fr}}
.card{all:unset;display:grid;grid-template-columns:76px 1fr;gap:18px;padding:18px 20px 18px 18px;border:1px solid var(--rule);cursor:pointer;background:var(--paper);transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,border-color .3s;text-align:left}
.card:hover{transform:translateY(-4px);box-shadow:0 24px 40px -28px rgba(36,32,28,.5);border-color:var(--ink-3)}
.card.on{border-color:var(--ink)}
.card .mini{width:76px;aspect-ratio:300/420;background:var(--c);background-image:var(--grain);position:relative;overflow:hidden;color:var(--t);font-weight:900;font-family:var(--sans)}
.card .mini span{position:absolute;left:-8px;bottom:-18px;font-size:72px;line-height:1;opacity:.92;letter-spacing:-.04em}
.card h3{font-family:var(--serif);font-weight:400;font-size:17px;margin:0 0 2px;line-height:1.3}
.card .when{font-size:12px;color:var(--ink-3);letter-spacing:.02em;margin-bottom:8px}
.card p{margin:0;font-size:13.5px;line-height:1.7;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .out{margin-top:8px;font-size:12px;color:var(--ink-2)}
.card .out b{font-weight:500;color:var(--ink)}
.card .go{margin-top:10px;font-size:12px;color:var(--ink-3)}
.card:hover .go{color:var(--red)}

/* ---- laptop ---- */
.laptop{position:absolute;right:-58px;bottom:0;width:118px;height:78px;perspective:700px;transform-style:preserve-3d}
.laptop .base{position:absolute;left:0;right:0;bottom:0;height:7px;background:#8d857c;background-image:var(--grain);border-radius:2px 2px 3px 3px}
.laptop .base::after{content:"";position:absolute;left:46px;right:46px;top:1px;height:2px;background:#5e5852;border-radius:1px}
.laptop .lid{position:absolute;left:4px;right:4px;bottom:7px;height:70px;background:#4a443f;background-image:var(--grain);border-radius:3px 3px 0 0;transform-origin:bottom center;transform:rotateX(-50deg);transition:transform .8s cubic-bezier(.2,.7,.2,1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.laptop .screen{position:absolute;inset:5px 5px 6px;background:#15130f;overflow:hidden}
.laptop .screen::before{content:"";position:absolute;left:8px;top:8px;width:22px;height:2px;background:#e9e2d8;opacity:.8}
.laptop .screen::after{content:"";position:absolute;left:8px;top:14px;width:2px;height:7px;background:var(--red);animation:blink 1s steps(2) infinite}
.laptop .dot{position:absolute;left:50%;top:2px;width:3px;height:3px;margin-left:-1px;border-radius:50%;background:#2a2522}
@keyframes blink{to{opacity:0}}
.laptop:hover .lid,.laptop.open .lid{transform:rotateX(-12deg)}
.laptop.open .screen{background:#1d2a3a}
.stack{width:190px}

/* ---- panel below shelf ---- */
.panel{grid-column:1 / -1;overflow:hidden;max-height:0;opacity:0;transition:max-height .8s cubic-bezier(.2,.7,.2,1),opacity .5s;margin-top:40px}
.panel.in{max-height:4000px;opacity:1}
.chapter{display:none;padding:10px 0 100px;border-top:1px solid var(--rule)}
.chapter.in{display:block;animation:fade .6s ease both}
@keyframes fade{from{opacity:0;translate:0 10px}to{opacity:1;translate:0 0}}
.page{max-width:820px;padding-top:44px}
.page h2{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3.2vw,38px);line-height:1.25;margin:0 0 6px}
.page .sub{color:var(--ink-3);font-size:13px;margin:0 0 26px;letter-spacing:.02em}
.page .role{font-size:14px;color:var(--ink-2);margin:0 0 24px}.page .role b{font-weight:500;color:var(--ink)}
.page .lede{font-size:17px;max-width:38em;margin:0 0 28px}.page .lede.small{font-size:15px;color:var(--ink-2)}.h3s{font-size:14px;font-weight:500;margin:0 0 8px}.page .lede a{color:inherit;text-decoration:none;border-bottom:1px solid var(--ink-3)}.page .lede a:hover{color:var(--red);border-color:var(--red)}
.facts{display:flex;flex-wrap:wrap;gap:10px 36px;margin:0 0 32px;padding:0;list-style:none}
.facts li{font-size:14px;color:var(--ink-2)}
.facts b{display:block;font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.1;color:var(--ink)}
.facts b i{font-style:normal;font-size:15px;font-family:var(--sans);color:var(--ink-2);margin-left:3px}
.ph{background:var(--mat);color:var(--ink-3);font-size:12px;display:flex;align-items:center;justify-content:center;letter-spacing:.06em}
.grid{display:grid;gap:14px;margin:0 0 32px}.c3{grid-template-columns:repeat(3,1fr)}.c2{grid-template-columns:repeat(2,1fr)}
.sp2{grid-column:span 2}.r169{aspect-ratio:16/9}.r34{aspect-ratio:3/4}.r11{aspect-ratio:1/1}
@media (max-width:640px){.c3{grid-template-columns:repeat(2,1fr)}}
.cols{display:grid;grid-template-columns:repeat(2,1fr);gap:24px 40px;padding:20px 0 0;border-top:1px solid var(--rule)}
@media (max-width:600px){.cols{grid-template-columns:1fr}}
.cols h3{font-size:14px;font-weight:500;margin:0 0 6px}.cols ul{margin:0;padding-left:1.1em;color:var(--ink-2);font-size:15px}
.sub-item{display:grid;grid-template-columns:1fr 200px;gap:24px;padding:26px 0;border-top:1px solid var(--rule)}
.sub-item:first-of-type{border-top:0;padding-top:0}
.sub-item h3{font-family:var(--serif);font-weight:400;font-size:21px;margin:0 0 6px}
.sub-item p{margin:0;color:var(--ink-2);font-size:15px}.sub-item .tag{font-size:13px;color:var(--ink-3);margin-top:6px}
@media (max-width:600px){.sub-item{grid-template-columns:1fr}}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--rule);padding:16px 0;font-family:var(--serif);font-size:19px}
.list li:last-child{border-bottom:1px solid var(--rule)}
.list li span{display:block;font-family:var(--sans);font-size:13px;color:var(--ink-3);margin-top:3px}
.note{font-size:13px;color:var(--ink-3);margin-top:18px}
.md p{margin:0 0 16px;max-width:38em;font-size:16px}.md .sub{color:var(--ink-3);font-size:13px;margin:-2px 0 24px;letter-spacing:.02em}.md h3{font-family:var(--serif);font-weight:400;font-size:21px;margin:30px 0 8px}.md ul{margin:0 0 16px;padding-left:1.1em;color:var(--ink-2);font-size:15px}.md .pics{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 16px;margin:10px 0 34px}.md .pics figure{margin:0;min-width:0}.md .pics figure.wide{grid-column:span 2}.md .pics figure.wide .im{aspect-ratio:8/3}.md .pics figure.wide img{object-position:center}.md .pics .im{aspect-ratio:4/3;background:var(--mat);overflow:hidden}.md .pics img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;cursor:zoom-in;transition:transform .5s cubic-bezier(.2,.7,.2,1)}.md .pics img:hover{transform:scale(1.02)}.md .pics figcaption{font-size:12px;color:var(--ink-3);padding:8px 0 0;letter-spacing:.02em}.md .pics .ph{height:100%}@media (max-width:640px){.md .pics{grid-template-columns:repeat(2,1fr)}.md .pics figure.wide{grid-column:span 2}}.md a{color:inherit;text-decoration:none;border-bottom:1px solid var(--ink-3)}.md a:hover{color:var(--red);border-color:var(--red)}.md .lb{position:fixed;inset:0;background:rgba(20,18,16,.92);display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}.md .lb img,.lbox img{max-width:min(1100px,94vw);max-height:92vh}.lbox{position:fixed;inset:0;background:rgba(20,18,16,.92);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}.lbox.on{display:flex}

/* camera panel */
.finder{background:#141210;color:#e9e2d8;margin:0 calc(-1 * clamp(20px,5vw,64px));padding:36px clamp(20px,5vw,64px) 40px}
.frame{position:relative;height:min(62vh,560px);display:flex;align-items:center;justify-content:center}
.frame .corner{position:absolute;width:26px;height:26px;border:1px solid rgba(233,226,216,.7)}
.frame .c1{left:0;top:0;border-right:0;border-bottom:0}.frame .c2{right:0;top:0;border-left:0;border-bottom:0}
.frame .c3{left:0;bottom:0;border-right:0;border-top:0}.frame .c4{right:0;bottom:0;border-left:0;border-top:0}
.frame .cross{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);opacity:.5}
.frame .cross::before,.frame .cross::after{content:"";position:absolute;background:#e9e2d8}
.frame .cross::before{left:50%;top:0;bottom:0;width:1px}.frame .cross::after{top:50%;left:0;right:0;height:1px}
.photo{width:min(820px,92%);height:88%;background:linear-gradient(135deg,#6f5f52,#3b3531);border:14px solid #0a0908;box-shadow:0 0 0 1px rgba(233,226,216,.15);display:flex;align-items:center;justify-content:center;color:rgba(233,226,216,.55);font-size:13px;letter-spacing:.1em;transition:opacity .25s}
.photo.fade{opacity:0}.photo img{width:100%;height:100%;object-fit:contain;display:none}.photo img.show{display:block}.photo{background:#1a1614}
.capbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-size:13px;color:#a39a91;margin-top:18px}.capbar .k{text-align:right}
.shutter{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;border:1px solid rgba(233,226,216,.6);display:grid;place-items:center}
.shutter::before{content:"";width:30px;height:30px;border-radius:50%;background:#e9e2d8;transition:transform .12s}
.shutter:active::before{transform:scale(.85)}
.capbar .k{font-size:12px;color:#6f655d}

/* notebook panel */
.entry{padding:28px 0;border-top:1px solid var(--rule);max-width:640px}
.entry:first-of-type{border-top:0;padding-top:0}
.entry time{display:block;font-size:12px;color:var(--ink-3);letter-spacing:.06em;margin-bottom:8px}
.entry p{margin:0;font-family:var(--serif);font-size:17px;line-height:1.9}

.foot{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);padding:30px 0 40px;border-top:1px solid var(--rule)}
.cover text{font-family:var(--sans)}.cover .serif{font-family:var(--serif)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .18 0" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="multiply"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation=".6"/></filter>
  </defs>
</svg>
<div class="wrap">
  <div class="top">
    <div class="name">Amity Qiu <span>邱璐鑫</span></div>
    <a href="mailto:Amity_Qiu@outlook.com">Amity_Qiu@outlook.com</a>
  </div>

  <div class="stage">
    <div class="motto">
      <h1>让内容有价值，<br>让传播有温度。</h1>
      <div id="intro"></div>
      <div class="hint" id="hint">欢迎抽一本我的案例case，来听我讲故事。</div>
    </div>

<script>
(function(){
  var books=document.querySelectorAll('.book,.obj'), panel=document.getElementById('panel'), shelf=document.getElementById('shelf');
  var chapters=document.querySelectorAll('.chapter'), hint=document.getElementById('hint'), hintDefault=hint.textContent;
  var lines={ai:'零代码做出来的几样东西',meshy:'从零开始的雇主品牌',style3d:'一个礼盒，怎么做成品牌触点',exhibition:'怎么宣发一场活动',early:'我学生时期的作品',articles:'我的署名文章汇编',research:'用心洞察世事，用理论总结事实',camera:'拍摄作品记录（仅生活向）',notes:'随手写的奇思妙想'};
  var cur=null;
  function open(id){
    books.forEach(function(b){b.classList.toggle('open',b.dataset.id===id);});
    document.querySelectorAll('.card').forEach(function(c){c.classList.toggle('on',c.dataset.card===id);});
    chapters.forEach(function(c){c.classList.toggle('in',c.dataset.ch===id);});
    panel.classList.add('in'); cur=id;
    setTimeout(function(){
      var y=shelf.getBoundingClientRect().top+window.scrollY-24;
      window.scrollTo({top:y,behavior:'smooth'});
    },80);
  }
  function close(){
    books.forEach(function(b){b.classList.remove('open');});
    document.querySelectorAll('.card').forEach(function(c){c.classList.remove('on');});
    panel.classList.remove('in'); cur=null;
    setTimeout(function(){chapters.forEach(function(c){c.classList.remove('in');});},600);
  }
  books.forEach(function(b){
    b.addEventListener('click',function(){cur===b.dataset.id?close():open(b.dataset.id);});
    b.addEventListener('mouseenter',function(){hint.textContent=lines[b.dataset.id]||hintDefault;});
    b.addEventListener('mouseleave',function(){hint.textContent=hintDefault;});
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});

  // ---- photos: read the photos/ folder of the GitHub repo ----
  var REPO='amityqiu/amityqiu.github.io';
  var shots=[], i=0, photo=document.getElementById('photo'), img=document.getElementById('photoImg'), empty=document.getElementById('photoEmpty'), cap=document.getElementById('capText'), cnt=document.getElementById('counter');
  function showShot(){
    if(!shots.length){img.classList.remove('show');empty.textContent='相册还是空的';cnt.textContent='0 / 0';return;}
    empty.textContent=''; img.src=shots[i]; img.classList.add('show'); cnt.textContent=(i+1)+' / '+shots.length;
  }
  function go(d){ if(!shots.length)return; i=(i+d+shots.length)%shots.length; photo.classList.add('fade'); setTimeout(function(){showShot();photo.classList.remove('fade');},220); }
  fetch('https://api.github.com/repos/'+REPO+'/contents/photos').then(function(r){return r.ok?r.json():[];}).then(function(list){
    shots=(list||[]).filter(function(f){return f.type==='file'&&/\.(jpe?g|png|webp|gif)$/i.test(f.name);})
      .sort(function(a,b){return a.name<b.name?1:-1;}).map(function(f){return 'photos/'+encodeURIComponent(f.name);});
    showShot();
  }).catch(showShot);
  document.getElementById('next').addEventListener('click',function(){go(1);});
  document.addEventListener('keydown',function(e){ if(cur==='camera'){if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);} });


  // ---- content: read content/*.md ----
  var IMG=/\.(jpe?g|png|webp|gif)$/i;
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  function inline(s){
    s=esc(s);
    s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    s=s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }
  function render(md){
    var lines=md.replace(/\r/g,'').split('\n'), out='', para=[], list=[], pics=[];
    function flush(){
      if(para.length){out+='<p>'+inline(para.join('')) +'</p>';para=[];}
      if(list.length){out+='<ul>'+list.map(function(l){return '<li>'+inline(l)+'</li>';}).join('')+'</ul>';list=[];}
      if(pics.length){out+='<div class="pics">'+pics.map(function(p){return '<figure'+(p.w?' class="wide"':'')+'><div class="im"><img src="images/'+encodeURIComponent(p.f)+'" alt="'+esc(p.c)+'" loading="lazy"></div>'+(p.c?'<figcaption>'+esc(p.c)+'</figcaption>':'')+'</figure>';}).join('')+'</div>';pics=[];}
    }
    lines.forEach(function(raw){
      var l=raw.trim();
      if(!l){flush();return;}
      if(l.indexOf('# ')===0){flush();out+='<h2>'+inline(l.slice(2))+'</h2>';return;}
      if(l.indexOf('## ')===0){flush();out+='<h3>'+inline(l.slice(3))+'</h3>';return;}
      if(l.indexOf('> ')===0){flush();out+='<p class="sub">'+inline(l.slice(2))+'</p>';return;}
      if(l.indexOf('- ')===0){if(para.length||pics.length)flush();list.push(l.slice(2));return;}
      var m=l.split('|'); var f=m[0].trim();
      if(IMG.test(f)&&f.indexOf(' ')<0){if(para.length||list.length)flush();pics.push({f:f,c:(m[1]||'').trim(),w:/宽|wide/.test((m[2]||''))});return;}
      if(list.length||pics.length)flush();
      para.push(l);
    });
    flush(); return out;
  }
  function load(el,name){
    fetch('content/'+encodeURIComponent(name)+'.md',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text();})
      .then(function(md){el.innerHTML='<div class="md">'+render(md)+'</div>';})
      .catch(function(){el.innerHTML='<p class="note">读不到 content/'+name+'.md</p>';});
  }
  chapters.forEach(function(c){if(c.dataset.md)load(c.querySelector('.page'),c.dataset.md);});
  var intro=document.getElementById('intro');
  fetch('content/home.md',{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).then(function(md){
    if(md.trim())intro.innerHTML=render(md);
  }).catch(function(){});
  // lightbox for content images
  var lbox=document.createElement('div'); lbox.className='lbox'; lbox.innerHTML='<img alt="">'; document.body.appendChild(lbox);
  document.addEventListener('click',function(e){var im=e.target.closest('.pics img'); if(im){lbox.querySelector('img').src=im.src;lbox.classList.add('on');}});
  lbox.addEventListener('click',function(){lbox.classList.remove('on');});
  document.addEventListener('error',function(e){var im=e.target; if(im.tagName==='IMG'&&im.closest('.pics')){var f=im.closest('.im'); f.innerHTML='<div class="ph">还没传：'+decodeURIComponent(im.getAttribute('src').replace('images/',''))+'</div>';}},true);


  // ---- cards: read content/cards.md ----
  var cardsBox=document.getElementById('cards');
  var colors={meshy:['#27364f','#e8e4da','菇'],style3d:['#c33a24','#f6e3dc','礼'],exhibition:['#2f4a3f','#dfe4d6','展'],early:['#d9a941','#3a2a08','作'],articles:['#efeae0','#2a1a15','稿'],research:['#5b4a6b','#eee8f0','美'],ai:['#1d2a3a','#e9e2d8','AI']};
  fetch('content/cards.md',{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).then(function(md){
    if(!md.trim())return;
    var blocks=md.replace(/\r/g,'').split(/\n\s*\n/).map(function(b){return b.trim();}).filter(Boolean), html='';
    blocks.forEach(function(b){
      var lines=b.split('\n'); var head=lines.shift().split('|').map(function(s){return s.trim();});
      var id=head[0], title=head[1]||'', when=head[2]||'', out='', body=[];
      lines.forEach(function(l){ if(l.indexOf('核心产出')===0){out=l.replace(/^核心产出[：:]\s*/,'');} else body.push(l.trim()); });
      var c=colors[id]||['#9a8672','#f2ebe2','·'];
      html+='<button class="card" data-card="'+id+'"><div class="mini" style="--c:'+c[0]+';--t:'+c[1]+'"><span>'+c[2]+'</span></div><div><h3>'+esc(title)+'</h3><div class="when">'+esc(when)+'</div><p>'+esc(body.join(''))+'</p>'+(out?'<div class="out"><b>核心产出</b>　'+esc(out)+'</div>':'')+'<div class="go">抽出这本 →</div></div></button>';
    });
    cardsBox.innerHTML=html;
    cardsBox.querySelectorAll('.card').forEach(function(c){
      c.addEventListener('click',function(){open(c.dataset.card);});
      c.addEventListener('mouseenter',function(){hint.textContent=lines[c.dataset.card]||hintDefault;});
      c.addEventListener('mouseleave',function(){hint.textContent=hintDefault;});
    });
  }).catch(function(){});

  // ---- notes: read notes.md ----
  fetch('notes.md',{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).then(function(md){
    var box=document.getElementById('notesBox'); if(!md.trim())return;
    var blocks=md.replace(/\r/g,'').split(/\n\s*\n/).map(function(b){return b.trim();}).filter(Boolean);
    var html='';
    blocks.forEach(function(b){
      var lines=b.split('\n'); var first=lines[0].trim();
      var date=/^\d{4}[.\-\/]\d{1,2}[.\-\/]\d{1,2}$/.test(first)?first:''; if(date)lines.shift();
      var body=lines.join('\n').trim().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');
      html+='<div class="entry">'+(date?'<time>'+date+'</time>':'')+'<p>'+body+'</p></div>';
    });
    box.innerHTML=html;
  }).catch(function(){});
})();
</script>
